security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        public_status:
            pattern: ^/(api/health|favicon\.ico)?$
            security: false

        main:
            lazy: true
            provider: app_user_provider

            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                failure_handler: App\Security\JsonAuthenticationFailureHandler

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 1209600
                path: /
                remember_me_parameter: _remember_me
                always_remember_me: false

            logout:
                path: /api/logout
                delete_cookies:
                    REMEMBERME: null

    access_control:
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/password, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/google, roles: PUBLIC_ACCESS }
        - { path: ^/api/search, roles: PUBLIC_ACCESS }
        - { path: ^/api/events, roles: PUBLIC_ACCESS }
        - { path: ^/api/organizers/\d+$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/admin/organizer-applications, roles: ROLE_ADMIN }
        - { path: ^/api/orders, roles: ROLE_USER }
        - { path: ^/api/organizer/events, roles: ROLE_USER }
        - { path: ^/api/organizer/ticket-types, roles: ROLE_USER }
        - { path: ^/api/organizer-application, roles: ROLE_USER }
        - { path: ^/api/me, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
