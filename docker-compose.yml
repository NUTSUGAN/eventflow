services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: eventflow_app
    restart: unless-stopped
    working_dir: /var/www/api
    command: sh -c "mkdir -p var/cache/dev/profiler var/cache/dev/doctrine/orm/Proxies var/log && chown -R www-data:www-data var && chmod -R 775 var && php-fpm"
    volumes:
      - ./api:/var/www/api
      - eventflow_vendor:/var/www/api/vendor
      - eventflow_var:/var/www/api/var
    environment:
      APP_ENV: dev
      APP_DEBUG: 0
      DATABASE_URL: "mysql://root:@host.docker.internal:3306/eventflow?serverVersion=10.4.32-MariaDB&charset=utf8mb4"
      MAILER_DSN: "smtp://mailpit:1025"


  nginx:
    image: nginx:alpine
    container_name: eventflow_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www/api
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  front:
    build:
      context: ./front
    container_name: eventflow_front
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./front:/app
      - eventflow_front_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: "http://localhost:8080"
      VITE_BACKEND_PUBLIC_URL: "http://localhost:8080"
    depends_on:
      - nginx

  mailpit:
    image: axllent/mailpit:latest
    container_name: eventflow_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  eventflow_vendor:
  eventflow_var:
  eventflow_front_node_modules:
