name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      APP_ENV: test
      APP_DEBUG: 0
      APP_SECRET: ci-eventflow-secret
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/eventflow_test?serverVersion=10.11.2-MariaDB&charset=utf8mb4
      MAILER_DSN: null://null
      MAILER_FROM_EMAIL: no-reply@eventflow.local
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      STRIPE_CHECKOUT_SUCCESS_URL: http://localhost:5173/checkout/success?orderId={ORDER_ID}&session_id={CHECKOUT_SESSION_ID}
      STRIPE_CHECKOUT_CANCEL_URL: http://localhost:5173/checkout/cancel?orderId={ORDER_ID}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, intl, pdo_mysql, zip, apcu
          tools: composer:v2
          coverage: none

      - name: Validate composer files
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Check PHP syntax
        run: find src config tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Lint YAML
        run: php bin/console lint:yaml config translations

      - name: Lint Symfony container
        run: php bin/console lint:container

      - name: Run tests
        run: vendor/bin/phpunit --colors=always

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: docker/php/Dockerfile
          - name: front
            context: front
            file: front/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: eventflow-${{ matrix.name }}:ci
